<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Glitch 2.0 Sign-In</title>
    <link rel="stylesheet" href="/kiosk/styles.css" />
  </head>
  <body>
    <main class="card">
      <h1>Glitch 2.0 Sign-In</h1>
      <p class="muted">Select your name and enter the 4-digit code from the display.</p>
      <form id="signin-form">
        <label for="name">Name</label>
        <select id="name" required>
          <option value="">Loading roster…</option>
        </select>

        <label for="code">Code</label>
        <input id="code" name="code" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="off" required />

        <div id="pin-section" class="hidden">
          <label for="pin">PIN</label>
          <input id="pin" inputmode="numeric" pattern="[0-9]{4,6}" maxlength="6" autocomplete="off" />
        </div>

        <div id="set-pin-section" class="hidden">
          <p class="hint">First time? Set a 4–6 digit PIN so friends can't sign you in.</p>
          <label for="subteam">Subteam</label>
          <select id="subteam">
            <option value="">Select your subteam</option>
            <option>CAD</option>
            <option>Mechanical</option>
            <option>Operations</option>
            <option>Software</option>
            <option>Strategy &amp; Drive</option>
          </select>
          <label for="new-pin">New PIN</label>
          <input id="new-pin" inputmode="numeric" pattern="[0-9]{4,6}" maxlength="6" autocomplete="off" />
          <label for="confirm-pin">Confirm PIN</label>
          <input id="confirm-pin" inputmode="numeric" pattern="[0-9]{4,6}" maxlength="6" autocomplete="off" />
        </div>

        <button type="submit" id="submit-button">Sign in</button>
        <p id="status" class="status" role="status"></p>
      </form>

      <button type="button" id="show-register" class="link-button">
        New member? Register — no Discord needed
      </button>

      <form id="register-form" class="hidden">
        <h2>Register</h2>
        <p class="muted">Create your sign-in account. You can link Discord later.</p>
        <label for="reg-first">First name</label>
        <input id="reg-first" autocomplete="given-name" required />
        <label for="reg-last">Last name</label>
        <input id="reg-last" autocomplete="family-name" required />
        <label for="reg-subteam">Subteam</label>
        <select id="reg-subteam" required>
          <option value="">Select your subteam</option>
          <option>CAD</option>
          <option>Mechanical</option>
          <option>Operations</option>
          <option>Software</option>
          <option>Strategy &amp; Drive</option>
        </select>
        <label for="reg-pin">PIN</label>
        <input id="reg-pin" inputmode="numeric" pattern="[0-9]{4,6}" maxlength="6" autocomplete="off" required />
        <label for="reg-confirm">Confirm PIN</label>
        <input id="reg-confirm" inputmode="numeric" pattern="[0-9]{4,6}" maxlength="6" autocomplete="off" required />
        <button type="submit">Create account</button>
        <button type="button" id="cancel-register" class="secondary">Back to sign in</button>
        <p id="register-status" class="status" role="status"></p>
      </form>
    </main>
    <script src="/kiosk/app.js"></script>
  </body>
</html>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101322"/>
      <stop offset="1" stop-color="#1b2140"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="210" height="297" fill="url(#bg)"/>

  <!-- Title -->
  <text x="105" y="34" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#7ce38b" letter-spacing="3">GLITCH ROBOTICS</text>
  <text x="105" y="54" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#ffffff">ATTENDANCE SIGN-IN</text>

  <!-- Steps -->
  <g font-family="Arial, Helvetica, sans-serif" fill="#ffffff">
    <text x="18" y="80" font-size="10" font-weight="bold">HOW TO SIGN IN</text>

    <text x="18" y="96"><tspan font-weight="bold">1.</tspan>  Scan the QR code with your phone camera</text>
    <text x="18" y="108"><tspan font-weight="bold">2.</tspan>  Select your name from the dropdown</text>
    <text x="18" y="120"><tspan font-weight="bold">3.</tspan>  Enter today's code exactly as shown</text>
    <text x="18" y="132"><tspan font-weight="bold">4.</tspan>  Tap Submit — you're done</text>
  </g>

  <!-- QR code box -->
  <rect x="36" y="146" width="138" height="138" rx="4" fill="#ffffff"/>
  <rect x="39" y="149" width="132" height="132" rx="2" fill="none" stroke="#101322" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="105" y="208" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#101322">QR CODE</text>
  <text x="105" y="221" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="6" fill="#101322">replace with generated QR</text>

  <!-- Today's code -->
  <text x="18" y="306" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#7ce38b">TODAY'S CODE:</text>
  <rect x="18" y="311" width="174" height="14" rx="3" fill="#ffffff"/>
  <text x="105" y="321" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#101322">GL-____   (write today's code here)</text>

  <!-- Footer -->
  <text x="105" y="286" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="7" fill="#9aa3c7">Sign in once per practice · Ask a mentor if you need help</text>
</svg>